title: "[스프린트] N주차 MM/DD(요일) ~ MM/DD(요일)"
body:
  - type: markdown
    attributes:
      value: |
        스프린트 시작일에 계획을 올리고, 마지막 날 회고 칸을 채워 주세요(글 수정 또는 댓글).
  - type: textarea
    id: goal
    attributes:
      label: 🎯 스프린트 목표
      placeholder: 이번 스프린트가 끝나면 무엇이 되어 있어야 하는지 한 줄로
    validations:
      required: true
  - type: textarea
    id: backlog
    attributes:
      label: ✅ 할 일
      value: |
        - [ ] 할 일 (담당)
        - [ ] 할 일 (담당)
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 🏁 완료 기준
      placeholder: "예: 앱 예약 → 입실 → 감지 → 알림이 한 번 끝까지 돈다"
  - type: textarea
    id: retro
    attributes:
      label: 회고
      value: |
        ## 이번 주 잘한 점

        - 

        ## 이번 주 개선해야 할 점

        - 
