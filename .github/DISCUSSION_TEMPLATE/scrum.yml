title: "[스크럼] N주차 N일차 MM/DD(요일)"
body:
  - type: markdown
    attributes:
      value: |
        제목 예: `[스크럼] 1주차 2일차 11/2(월)`
        공통은 "A vs B -> 결정" 형식으로, 안 정해졌으면 "아직 안 정해짐"이라고 적어 주세요.
  - type: textarea
    id: common
    attributes:
      label: 공통
      value: |
        - 항목: A vs B -> 결정
    validations:
      required: true
