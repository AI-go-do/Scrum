name: Post discussion

# posts/ 폴더에 새 .md 파일이 main에 올라오면 Discussion 글로 게시한다.
# 파일 맨 위 형식:
#   title: [스크럼] 1주차 2일차 11/2(월)
#   category: Scrum
#   ---
#   (본문 마크다운)

on:
  push:
    branches: [main]
    paths: ["posts/**.md", "!posts/README.md"]
  workflow_dispatch:
    inputs:
      file:
        description: "게시할 파일 경로 (예: posts/2026-11-02-scrum.md)"
        required: true

permissions:
  contents: read
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new posts
        id: files
        env:
          INPUT_FILE: ${{ inputs.file }}
        run: |
          if [ -n "$INPUT_FILE" ]; then
            echo "$INPUT_FILE" > files.txt
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
            git diff --name-only --diff-filter=A "$before" "${{ github.sha }}" -- 'posts/*.md' | grep -v '^posts/README.md$' > files.txt || true
          fi
          cat files.txt

      - name: Create discussions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          while read -r f; do
            [ -f "$f" ] || continue
            title=$(sed -n 's/^title:[[:space:]]*//p' "$f" | head -1)
            category=$(sed -n 's/^category:[[:space:]]*//p' "$f" | head -1)
            body=$(awk 'found{print} /^---[[:space:]]*$/ && !found {found=1}' "$f")
            if [ -z "$title" ] || [ -z "$category" ]; then
              echo "::error file=$f::title 또는 category 줄이 없습니다"; exit 1
            fi

            ids=$(gh api graphql -f owner="$OWNER" -f name="$REPO" -f query='
              query($owner:String!, $name:String!) {
                repository(owner:$owner, name:$name) {
                  id
                  discussionCategories(first:50) { nodes { id name } }
                }
              }')
            repo_id=$(echo "$ids" | jq -r '.data.repository.id')
            cat_id=$(echo "$ids" | jq -r --arg c "$category" '.data.repository.discussionCategories.nodes[] | select(.name==$c) | .id')
            if [ -z "$cat_id" ]; then
              echo "::error file=$f::카테고리 '$category'를 찾을 수 없습니다"; exit 1
            fi

            url=$(gh api graphql -f repo="$repo_id" -f cat="$cat_id" -f title="$title" -f body="$body" -f query='
              mutation($repo:ID!, $cat:ID!, $title:String!, $body:String!) {
                createDiscussion(input:{repositoryId:$repo, categoryId:$cat, title:$title, body:$body}) {
                  discussion { url }
                }
              }' --jq '.data.createDiscussion.discussion.url')
            echo "게시됨: $url"
            echo "- [$title]($url)" >> "$GITHUB_STEP_SUMMARY"
          done < files.txt
